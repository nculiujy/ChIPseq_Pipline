          filename: "Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"
          size_mb: 830
        gff:
          url: "https://ftp.ensembl.org/pub/release-110/gtf/homo_sapiens/Homo_sapiens.GRCh38.110.gtf.gz"
          filename: "Homo_sapiens.GRCh38.110.gtf.gz"
          size_mb: 50
      UCSC_hg38:
        label: "UCSC hg38 (BigZips)"
        fasta:
          url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz"
          filename: "hg38.fa.gz"
          size_mb: 950
        gff:
          url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/genes/hg38.ncbiRefSeq.gff3.gz"
          filename: "hg38.ncbiRefSeq.gff3.gz"
          size_mb: 60

