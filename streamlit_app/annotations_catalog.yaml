        label: "UCSC mm10"
        fasta:
          url: "https://hgdownload.soe.ucsc.edu/goldenPath/mm10/bigZips/mm10.fa.gz"
          filename: "mm10.fa.gz"
          size_mb: 800
        gff:
          url: "https://hgdownload.soe.ucsc.edu/goldenPath/mm10/bigZips/genes/mm10.ncbiRefSeq.gff3.gz"
          filename: "mm10.ncbiRefSeq.gff3.gz"
          size_mb: 50

