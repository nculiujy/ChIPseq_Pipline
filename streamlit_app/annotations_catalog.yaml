          filename: "Mus_musculus.GRCm39.dna.primary_assembly.fa.gz"
          size_mb: 700
        gff:
          url: "https://ftp.ensembl.org/pub/release-110/gtf/mus_musculus/Mus_musculus.GRCm39.110.gtf.gz"
