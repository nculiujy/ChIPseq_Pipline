name: ChIPseq_Pipline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ---------- 命令行 / 流程工具 ----------
  - python=3.9
  # numpy 必须压在 1.x：macs2 2.2.7.1 的 Cython 扩展（IO/Parser 等 .so）按 numpy 1.x
  # 编译，numpy 2.0 把 PyArray_Descr 的 hash 字段外移、结构体从 96 字节缩到 88，
  # 编译期尺寸硬编码进 .so，import 时校验不过就抛
  #   ValueError: numpy.dtype size changed, expected 96 from C header, got 88
  # 注意 macs2 自身只声明 numpy >=1.17（无上界），不显式 pin 的话求解器会选 2.x，
  # 装完看着成功、跑到 peak calling 才炸。deeptools 新版声明 numpy>=2，
  # 加了这条后求解器会自动把它降到兼容 numpy 1.x 的构建。
  - numpy<2
  # workflow/scripts 里的 python 脚本直接 import 这两个包。目前只是跟着 snakemake /
  # deeptools 的依赖链间接受装，一旦上游改声明就会漏装，而 6_1_motif.py 第 16 行
  # 就是 import yaml，缺了直接 ModuleNotFoundError 把整条管线带挂。显式写上。
  - pyyaml
  - pandas
  - snakemake
  - samtools
  - fastqc
  - deeptools
  - picard
  - macs2=2.2.7.1
  - trim-galore
  - perl
  - bowtie2
  - sra-tools
  - bedtools
  - poppler
  - pdf2image
  - perl-xml-simple

  # ---------- 注释资源下载 ----------
  # aria2：物种注释（Ensembl/NCBI/UCSC）走多连接分段下载。跨境外链单连接受 RTT 限制
  # 只有 0.4MB/s 量级，多连接可到 0.7~2.4MB/s；缺失时 annotation_worker 会自动回退
  # 单连接 urllib，但那条路在部分网络下连 TLS 握手都过不去。
  - aria2

  # ---------- R 运行时 + 流程用到的 R 包 ----------
  # 全部走 bioconda/conda-forge 的预编译二进制：conda env create/update 一条命令装齐，
  # 不需要 gcc/gfortran，也不依赖访问 bioconductor.org 现编源码。
  # 曾经把这些移出去、改成 install_R_packages.R 从源码编译，结果是：缺编译器就一片
  # "had non-zero exit status"，而该步失败只 warn，bootstrap --full 看着成功实则缺包。
  # 注意：bioconductor-* 按 r45 构建，求解器会把 r-base 定在 4.5.x（Bioc 3.22）。
  - r-base
  - r-optparse
  - r-yaml
  - r-rcolorbrewer
  - r-ggplot2
  - r-dplyr
  - r-pheatmap
  - r-ggrepel
  - r-readr
  - r-stringr
  - bioconductor-chipseeker
  - bioconductor-rtracklayer
  - bioconductor-genomicfeatures
  - bioconductor-genomicranges
  - bioconductor-clusterprofiler
  - bioconductor-txdbmaker    # Bioc>=3.21 起 makeTxDbFromGFF 从 GenomicFeatures 拆出

  # ---------- 编译工具链（留给临时 install.packages 用，非必需）----------
  - compilers
  - make
