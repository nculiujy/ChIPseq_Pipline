name: ChIPseq_Pipline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # 仅命令行 / 流程工具。R 包（ChIPseeker、clusterProfiler 等）不写在这里，
  # 由 install_R_packages.R 写到 <analysis>/lib/R/library（与 workflow 中
  # CONDA_PREFIX/lib/R/library 硬指向保持同步）。
  # r-base 由 macs2/picard 传递引入；为了 install.packages 能编译，额外拉 compilers
  # 将 x86_64-conda-linux-gnu-{cc,cxx,gfortran} 装到同一个 prefix 里。
  - python=3.9
  - snakemake
  - samtools
  - fastqc
  - deeptools
  - picard
  - macs2=2.2.7.1
  - trim-galore
  - perl
  - bowtie2
  - sra-tools
  - bedtools
  - poppler
  - pdf2image
  - perl-xml-simple
  - compilers
  - make
