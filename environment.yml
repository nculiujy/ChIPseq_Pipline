name: ChIPseq_Pipline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # 仅命令行 / 流程工具。R 运行时（含 ChIPseeker、clusterProfiler 等包）刻意不装在这里，
  # 由系统 / 管理员基线的 R（如 R 4.4.1）提供——避免分析环境里的精简 r-base 生成
  # chipseq-env/bin/Rscript 而遮蔽系统那个已装满包的 R。详见 README《R 安装指南》。
  # 同理不装 phantompeakqualtools（它会把 r-base 拖进来）；SPP 仅为 4_1 的可选步骤，缺失会跳过。
  - python=3.9
  - snakemake
  - samtools
  - fastqc
  - deeptools
  - picard
  - macs2=2.2.7.1
  - trim-galore
  - perl
  - bowtie2
  - sra-tools
  - bedtools
  - poppler
  - pdf2image
  - perl-xml-simple
